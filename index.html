<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplicativo de Previsão do Tempo - Rayssa Ferraz" />
    <meta name="author" content="Rayssa Ferraz" />
    <title>Previsão do Tempo</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/styles.css" />
</head>

<body>
    <div class="container">
        <!-- Tela de busca -->
        <div id="searchScreen">
            <div class="weather-icons">
                <img src="./assets/img/sol.png" alt="Sol" class="icon-sun" />
                <img src="./assets/img/nuvem.png" alt="Nuvem" class="icon-cloud" />
                <img src="./assets/img/chovendo.png" alt="Chuva" class="icon-rain" />
            </div>
            <h1>Previsão do Tempo</h1>

            <div class="search-area">
                <input type="text" id="cityInput" placeholder="Digite o nome da cidade" />
                <button id="searchBtn">Buscar</button>
            </div>

            <div id="loading">Carregando...</div>
        </div>

        <!-- Tela de resultado -->
        <div id="resultScreen">
            <div class="weather-header">
                <p id="temperature"></p>
            </div>

            <div class="weather-info">
                <h2 id="cityName"></h2>
            </div>

            <button id="backBtn" title="Voltar ao início">
                <img src="./assets/img/home.png" alt="Voltar" />
            </button>
        </div>
    </div>

    <!-- JS -->
    <script src="./assets/js/api.js"></script>
</body>

</html>
