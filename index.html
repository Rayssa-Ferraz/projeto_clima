<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />

    <!-- ================================ -->
    <!-- 🔒 SECURITY HEADERS - OBRIGATÓRIO -->
    <!-- ================================ -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
        img-src 'self' data: https:;
        connect-src 'self' https://geocoding-api.open-meteo.com https://api.open-meteo.com https://cdnjs.cloudflare.com;
        base-uri 'self';
        form-action 'self';
    ">

    <!-- Controle de referência segura -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- VIEWPORT E METADADOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplicativo de Previsão do Tempo com Segurança Aprimorada - Rayssa Ferraz" />
    <meta name="author" content="Rayssa Ferraz" />
    <meta name="theme-color" content="#87CEEB">

    <title>Previsão do Tempo - Seguro e Confiável</title>

    <!-- ================================= -->
    <!-- 🔗 PRECONNECT PARA PERFORMANCE     -->
    <!-- ================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com">
    <link rel="preconnect" href="https://api.open-meteo.com">

    <!-- ================================ -->
    <!-- ✨ FONTES GOOGLE                  -->
    <!-- ================================ -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!-- ========================================== -->
    <!-- ☁️ WEATHER ICONS COM SRI (SEGURANÇA EXTRA) -->
    <!-- ========================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css"
        integrity="sha512-r/Gan7PMSRovDus++vDS2Ayutc/cSdl268u047n4z+k7GYuR7Hiw71FsT3QQxdKJBVHYttOJ6IGLnlM9IoMToQ=="
        crossorigin="anonymous"
    >

    <!-- ================================ -->
    <!-- 🎨 SEU CSS                        -->
    <!-- ================================ -->
    <link rel="stylesheet" href="./assets/css/styles.css" />
</head>

<body>

    <div class="container">

        <!-- 🌦️ TELA DE BUSCA -->
        <div id="searchScreen">
            <div class="weather-icons">
                <img src="./assets/img/sol.png" alt="Sol" class="icon-sun" />
                <img src="./assets/img/nuvem.png" alt="Nuvem" class="icon-cloud" />
                <img src="./assets/img/chovendo.png" alt="Chuva" class="icon-rain" />
            </div>

            <h1>Previsão do Tempo</h1>

            <div class="search-area">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Digite o nome da cidade"
                    maxlength="100"
                    autocomplete="off"
                    aria-label="Nome da cidade"
                />
                <button id="searchBtn" aria-label="Buscar previsão do tempo">Buscar</button>
            </div>

            <div id="loading" aria-live="polite">Carregando...</div>
            <div id="error" role="alert"></div>
        </div>

        <!-- 🌤️ TELA DE RESULTADO -->
        <div id="resultScreen">

            <!-- Cabeçalho com ícone e temperatura -->
            <div class="weather-header">
                <i class="weather-icon" id="weatherIcon"></i>
                <p id="temperature"></p>
            </div>

            <!-- Informações do clima -->
            <div class="weather-info">
                <h2 id="cityName"></h2>
                <p id="description"></p>
                <p id="currentDate"></p>
            </div>

            <!-- 🌦️ Previsão dos próximos dias -->
            <h3 class="forecast-title">Próximos Dias</h3>
            <div id="forecastContainer" class="forecast-container"></div>

            <!-- Botão de voltar -->
            <button id="backBtn" title="Voltar ao início">
                <img src="./assets/img/home.png" alt="Voltar" />
            </button>

        </div>
    </div>

    <!-- 🔒 AVISO DE PRIVACIDADE — RODAPÉ -->
    <footer class="privacy-footer">
        <p>🔒 Esta aplicação não coleta, armazena ou compartilha dados pessoais. As buscas são processadas em tempo real e não são registradas.</p>
        <p>🌦️ Dados meteorológicos fornecidos por 
            <a href="https://open-meteo.com/" target="_blank">Open-Meteo.com</a> 
            sob licença 
            <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>.
        </p>
    </footer>

    <!-- ================================ -->
    <!-- 📌 JAVASCRIPT                    -->
    <!-- ================================ -->
    <script src="./assets/js/api.js"></script>

</body>
</html>
